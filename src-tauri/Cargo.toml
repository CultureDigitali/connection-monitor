[package]
name = "connection-monitor"
version = "0.2.0"
description = "Mac Connection Monitor - Bandwidth & Quality"
authors = ["Culture Digitali Srl <info@culturedigitali.eu>"]
edition = "2021"

[lib]
name = "connection_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
surge-ping = "0.8"
tokio = { version = "1", features = ["full"] }
dns-lookup = "2.0"
chrono = "0.4"
parking_lot = "0.12"
dirs = "5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
